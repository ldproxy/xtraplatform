
maturity = 'CANDIDATE'
maintenance = 'LOW'
description = 'Restrict access to resources (OpenID Connect, JWT, XACML JSON).'
descriptionDe = 'Zugriff auf Ressourcen einschränken (OpenID Connect, JWT, XACML JSON).'

dependencies {
    provided project(':xtraplatform-web')
    provided project(':xtraplatform-streams')
    provided project(':xtraplatform-blobs')
    provided project(':xtraplatform-entities')
    provided project(':xtraplatform-values')
    provided project(':xtraplatform-openapi')
    provided project(':xtraplatform-services')

    embeddedFlatExport libs.bundles.auth
}

// copied to src/main/resources/de/ii/xtraplatform/auth/assets
sbom {
    component name: 'oauth4webapi', version: '2.3.0', purl: 'pkg:npm/oauth4webapi@2.3.0', license: 'MIT', website: 'https://github.com/panva/oauth4webapi'
}
