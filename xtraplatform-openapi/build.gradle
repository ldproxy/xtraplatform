
maturity = 'MATURE'
maintenance = 'FULL'
description = 'OpenAPI definitions and clients.'
descriptionDe = 'OpenAPI Definitionen und Clients.'

dependencies {
    provided project(':xtraplatform-web')

    embeddedFlatExport libs.bundles.openapi
}

moduleInfo {
    exports = [
            '!io.github.classgraph*',
            '!nonapi.io.github.classgraph*',
    ]
    requires = [
            'java.logging',
            'java.xml',
    ]
    uses = [
        'io.swagger.v3.jaxrs2.ext.OpenAPIExtension',
        'io.swagger.v3.core.converter.ModelConverter',
    ]
}

// copied from swagger-ui-dist to src/main/resources/de/ii/xtraplatform/openapi/assets
sbom {
    component name: 'swagger-ui-dist', version: '5.4.2', purl: 'pkg:npm/swagger-ui-dist@5.4.2', license: 'Apache-2.0', website: 'https://github.com/swagger-api/swagger-ui'
}
